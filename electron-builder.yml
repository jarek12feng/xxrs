appId: com.xxrs.cultivationlife
productName: 长生未央试玩版
asar: true
artifactName: ChangShengWeiYang-Demo-${version}-Windows-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
win:
  executableName: cultivation-life
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
nsis:
  artifactName: ChangShengWeiYang-Demo-${version}-Windows-${arch}-Setup.${ext}
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: 长生未央试玩版
  runAfterFinish: false
  packElevateHelper: false
