<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>长生未央 · 移动端布局验收</title>
    <style>
      body {
        margin: 0;
        background: #29392f;
        color: #eee;
        font: 14px system-ui;
        text-align: center;
      }
      header {
        padding: 12px;
      }
      button {
        padding: 12px 18px;
        margin: 4px;
        min-height: 44px;
      }
      iframe {
        display: block;
        margin: 0 auto;
        border: 0;
        background: #f7f6ee;
        width: 390px;
        height: 780px;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      开发验收工具：真实 iframe 视口，不是缩小截图<br /><button
        onclick="size(360, 740)"
      >
        360 × 740</button
      ><button onclick="size(390, 780)">390 × 780</button
      ><button onclick="size(430, 860)">430 × 860</button
      ><button onclick="size(844, 390)">横屏 844 × 390</button>
    </header>
    <iframe id="phone" src="/" title="手机游戏预览"></iframe>
    <script>
      function size(w, h) {
        const p = document.getElementById("phone");
        p.style.width = w + "px";
        p.style.height = h + "px";
      }
    </script>
  </body>
</html>
